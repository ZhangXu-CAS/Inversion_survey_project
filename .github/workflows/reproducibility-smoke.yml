name: Reproducibility smoke test
on:
  push:
    paths:
      - "scripts/audit_final_tables.py"
      - "tests/test_final_tables.py"
      - ".github/workflows/reproducibility-smoke.yml"
  pull_request:
    paths:
      - "scripts/audit_final_tables.py"
      - "tests/test_final_tables.py"
      - ".github/workflows/reproducibility-smoke.yml"
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Exercise deterministic fixtures
        run: python -m unittest discover -s tests -v
